spec_version: 2
name: __NAME__
version: 0.1.0

# What the evaluator reports, in ranking order: every passing report must start
# with exactly these, and ranking is lexicographic in this order.
metrics:
  - {name: score, direction: max}

# Hard kill for a hung evaluator. Not a semantic time limit: if your task has a
# time budget, enforce it inside eval.py, which owns the official clock.
watchdog_timeout_s: 600

# Typed knobs the tool validates and passes to eval() as keyword arguments.
params:
  tolerance: {type: float, default: 1.0e-6, min: 0.0}

# Large assets stay out of git and are bound into the hill's identity by hash.
# blobs:
#   threshold: 10MB
#   track: ["data/**"]

# Uncomment when the metric is a physical measurement on shared hardware, so
# concurrent official runs cannot corrupt each other.
# exclusive: gpu

# To run the evaluator inside a container image instead of the uv environment
# (for a heavy toolchain, a non-Python stack, or a reproducible base), set
# `spec_version: 3` above and add:
# environment:
#   image: ghcr.io/you/your-image@sha256:...   # pin by digest, not a mutable tag
