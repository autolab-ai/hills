[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hills"
version = "0.1.0"
description = "Local verification environments for AI research agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Autolab" }]
keywords = ["evaluation", "benchmark", "agents", "verification", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/QKayV/hills"
Repository = "https://github.com/QKayV/hills"
Specification = "https://github.com/QKayV/hills/blob/main/docs/SPEC.md"
Issues = "https://github.com/QKayV/hills/issues"

[project.scripts]
hills = "hills.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hills"]

[tool.hatch.build.targets.wheel.force-include]
"skills/hills" = "hills/_skill"
"examples/circle-packing" = "hills/_templates/circle-packing"
"examples/nanogpt-10min" = "hills/_templates/nanogpt-10min"

[tool.pytest.ini_options]
testpaths = ["tests"]
