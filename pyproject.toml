[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hills"
version = "0.1.0"
description = "Local verification environments for AI research agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Autolab" }]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
hills = "hills.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hills"]

[tool.hatch.build.targets.wheel.force-include]
"skills/hills" = "hills/_skill"
"examples/circle-packing" = "hills/_templates/circle-packing"
"examples/nanogpt-10min" = "hills/_templates/nanogpt-10min"

[tool.pytest.ini_options]
testpaths = ["tests"]
